<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>VTU GitHub + Real AI</title>
<style>body{margin:0;background:linear-gradient(135deg,#667eea,#764ba2);font-family:Arial;padding:12px;display:flex;justify-content:center;min-height:100vh}.box{background:#fff;padding:22px;border-radius:18px;max-width:500px;width:100%}input,select,button{width:100%;padding:12px;margin:7px 0;border-radius:10px;border:1px solid #ccc}button{background:#667eea;color:#fff;border:none;font-weight:700;cursor:pointer}img{width:100%;border-radius:10px;display:none;margin-top:10px}#raw{background:#0f172a;color:#22c55e;padding:12px;border-radius:10px;font-size:11px;white-space:pre-wrap;max-height:250px;overflow:auto;display:none;margin-top:10px}.ok{background:#dcfce7;color:#166534;padding:14px;border-radius:10px;margin-top:10px;text-align:center;font-weight:700}.no{background:#fee2e2;color:#991b1b;padding:14px;border-radius:10px;margin-top:10px;text-align:center;font-weight:700}.badge{display:inline-block;background:#e0e7ff;color:#4338ca;padding:5px 10px;border-radius:20px;font-size:12px;margin:2px}</style>
</head><body><div class="box">
<h2 style="text-align:center;margin:0">VTU Scholarship Checker</h2>
<p style="text-align:center;font-size:11px;color:#666">GitHub Hosted + Real AI Backend (Not Guessing)</p>

<select id="caste"><option value="">Select Category</option><option>SC</option><option>ST</option><option>OBC</option><option>General</option></select>
<input id="income" type="number" placeholder="Family Income (ex: 80000)">
<input type="file" id="file" accept="image/*">
<img id="preview">
<div id="status" style="background:#fef3c7;padding:10px;border-radius:8px;text-align:center;font-size:13px">Upload marks card</div>
<div style="margin-top:8px"><span class="badge" id="b_cgpa">CGPA: --</span> <span class="badge" id="b_p">P: --</span> <span class="badge" id="b_f">F: --</span></div>
<pre id="raw"></pre>
<button onclick="check()">Check Eligibility</button>
<div id="result"></div>
<p style="font-size:10px;color:#888;text-align:center;margin-top:12px">Frontend: GitHub Pages | Backend: HuggingFace EasyOCR Real AI<br>Raw OCR proof shown below</p>
</div>

<script>
// 👇 PASTE YOUR HUGGING FACE GRADIO LINK HERE - IMPORTANT
const HF_SPACE_URL = "https://YOURNAME-vtu-backend.hf.space";

let aiData = null;

document.getElementById('file').addEventListener('change', async (e)=>{
  const file = e.target.files[0]; if(!file) return;
  document.getElementById('preview').src = URL.createObjectURL(file);
  document.getElementById('preview').style.display='block';
  document.getElementById('status').innerText='⏳ Calling Real AI Backend... 20 sec';

  const form = new FormData();
  form.append('file', file);

  try{
    // Gradio API call - real reading
    const response = await fetch(HF_SPACE_URL + "/api/predict", {
      method: "POST",
      body: form
    });
    // For Gradio, we need to use gradio client - simpler: call our Flask version if you used Flask backend
    // If you used Gradio backend, use this client method:
    document.getElementById('status').innerText='If this fails, use Flask backend link (I gave earlier) - Gradio needs JS client';
  }catch(err){
    document.getElementById('status').innerText='Error: '+err.message;
  }
});

// SIMPLE WORKING VERSION - Use Flask backend for GitHub - BEST
// So use this function if you deployed Flask backend (app.py with /api/scan)
async function scanWithFlask(file){
  const BACKEND = HF_SPACE_URL + "/api/scan";
  const fd = new FormData(); fd.append('file', file);
  const res = await fetch(BACKEND, {method:'POST', body:fd});
  const data = await res.json();
  return data;
}

// Override file change to use Flask backend (RECOMMENDED)
document.getElementById('file').addEventListener('change', async (e)=>{
  const file = e.target.files[0]; if(!file) return;
  document.getElementById('preview').src = URL.createObjectURL(file);
  document.getElementById('preview').style.display='block';
  document.getElementById('status').innerText='⏳ Real AI Reading from HF Backend...';
  try{
    const data = await scanWithFlask(file);
    aiData = data;
    document.getElementById('b_cgpa').innerText='CGPA: '+data.cgpa;
    document.getElementById('b_p').innerText='P: '+data.p_count;
    document.getElementById('b_f').innerText='F: '+data.f_count;
    document.getElementById('status').innerText='✅ REAL READ: CGPA '+data.cgpa+' P='+data.p_count+' F='+data.f_count;
    document.getElementById('raw').style.display='block';
    document.getElementById('raw').innerText='REAL AI RAW TEXT (Proof not guessing):\n'+data.raw_text;
  }catch(err){
    document.getElementById('status').innerText='Backend not reachable - check HF link is running: '+err.message;
  }
});

function check(){
  const caste=document.getElementById('caste').value;
  const inc=parseInt(document.getElementById('income').value||0);
  const r=document.getElementById('result');
  if(!aiData||!aiData.cgpa){ r.innerHTML='<div class=no>Upload marks card - wait for Real AI read</div>'; return; }
  if(!caste||!inc){ r.innerHTML='<div class=no>Select caste & income</div>'; return; }
  const max=(caste=='SC'||caste=='ST')?250000:100000;
  if(inc>max){ r.innerHTML=`<div class=no>❌ NOT ELIGIBLE<br>Income ${inc} > ${max} for ${caste}</div>`; return; }
  if(aiData.f_count>0){ r.innerHTML=`<div class=no>❌ NOT ELIGIBLE<br>AI detected ${aiData.f_count} Backlog F<br>CGPA ${aiData.cgpa} ok but FAIL</div>`; return; }
  if(aiData.cgpa<5){ r.innerHTML=`<div class=no>❌ NOT ELIGIBLE<br>CGPA ${aiData.cgpa} <5</div>`; return; }
  r.innerHTML=`<div class=ok>✅ ELIGIBLE - REAL AI VERIFIED<br>CGPA ${aiData.cgpa} (${aiData.percentage}%)<br>P=${aiData.p_count} F=0<br>Can apply SSP/NSP</div>`;
}
</script></body></html>
