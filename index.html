<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>VTU REAL GitHub</title>
<style>body{margin:0;background:#667eea;font-family:Arial;padding:12px;display:flex;justify-content:center;min-height:100vh}.box{background:#fff;padding:22px;border-radius:18px;max-width:500px;width:100%}input,select,button{width:100%;padding:12px;margin:7px 0;border-radius:10px;border:1px solid #ccc}button{background:#667eea;color:#fff;border:none;font-weight:700;cursor:pointer}img{width:100%;border-radius:10px;display:none;margin-top:10px}#raw{background:#0f172a;color:#22c55e;padding:12px;border-radius:10px;font-size:11px;white-space:pre-wrap;max-height:250px;overflow:auto;display:none;margin-top:10px}.ok{background:#dcfce7;color:#166534;padding:14px;border-radius:10px;margin-top:10px;text-align:center;font-weight:700}.no{background:#fee2e2;color:#991b1b;padding:14px;border-radius:10px;margin-top:10px;text-align:center;font-weight:700}.badge{display:inline-block;background:#e0e7ff;color:#4338ca;padding:5px 10px;border-radius:20px;font-size:12px;margin:2px}</style>
</head><body><div class="box">
<h2 style="text-align:center;margin:0">VTU REAL AI Reader</h2>
<p style="text-align:center;font-size:11px;color:#666">GitHub Pages + OCR.Space Real AI - Not Guessing</p>
<select id="caste"><option value="">Category</option><option>SC</option><option>ST</option><option>OBC</option><option>General</option></select>
<input id="income" type="number" placeholder="Income ex: 80000">
<input type="file" id="file" accept="image/*"><img id="preview">
<div id="status" style="background:#fef3c7;padding:10px;border-radius:8px;text-align:center;font-size:13px">Upload marks card - Real AI will read</div>
<div><span class="badge" id="b_cgpa">CGPA: --</span> <span class="badge" id="b_p">P: --</span> <span class="badge" id="b_f">F: --</span></div>
<pre id="raw"></pre>
<button onclick="check()">Check Eligibility</button><div id="result"></div>
</div>
<script>
const API_KEY = "YOUR_API_KEY_HERE"; // <--- PASTE YOUR OCR.SPACE KEY HERE
let aiData=null;
document.getElementById('file').addEventListener('change', async(e)=>{
 let file=e.target.files[0]; if(!file) return;
 document.getElementById('preview').src=URL.createObjectURL(file);
 document.getElementById('preview').style.display='block';
 document.getElementById('status').innerText='⏳ Real AI Reading via OCR.Space...';
 let fd=new FormData(); fd.append('file',file); fd.append('language','eng'); fd.append('isTable','true'); fd.append('OCREngine','2');
 try{
  let res=await fetch('https://api.ocr.space/parse/image',{method:'POST',headers:{'apikey':API_KEY},body:fd});
  let data=await res.json();
  console.log(data);
  let text=data.ParsedResults[0].ParsedText;
  document.getElementById('raw').style.display='block';
  document.getElementById('raw').innerText='REAL AI RAW TEXT (Proof):\n'+text;
  // Extract CGPA
  let cgpa=0; let m=text.match(/(?:CGPA|SGPA)[^0-9]{0,10}([0-9]\.[0-9]{1,2})/i);
  if(m) cgpa=parseFloat(m[1]);
  if(cgpa==0){ let nums=text.match(/\b[0-9]\.[0-9]{1,2}\b/g); if(nums){ for(let i=nums.length-1;i>=0;i--){ let v=parseFloat(nums[i]); if(v>=4&&v<=10){ cgpa=v; break; } } } }
  let f_count=0,p_count=0; let lines=text.split('\n');
  for(let line of lines){ if(/[0-9]{2}[A-Z]{2,}/.test(line.toUpperCase())){ if(line.toUpperCase().includes(' F')||line.toUpperCase().includes('FAIL')) f_count++; else if(line.toUpperCase().includes(' P')) p_count++; } }
  aiData={cgpa:cgpa,p_count:p_count,f_count:f_count,percentage:cgpa?((cgpa-0.5)*10).toFixed(2):0,raw_text:text};
  document.getElementById('b_cgpa').innerText='CGPA: '+cgpa; document.getElementById('b_p').innerText='P: '+p_count; document.getElementById('b_f').innerText='F: '+f_count;
  document.getElementById('status').innerText='✅ REAL READ: CGPA '+cgpa+' P='+p_count+' F='+f_count;
 }catch(err){ document.getElementById('status').innerText='API Error: '+err.message+' - Check API Key'; }
});
function check(){
 let caste=document.getElementById('caste').value, inc=parseInt(document.getElementById('income').value||0), r=document.getElementById('result');
 if(!aiData||!aiData.cgpa){ r.innerHTML='<div class=no>Upload and wait for AI</div>'; return; }
 if(!caste||!inc){ r.innerHTML='<div class=no>Select caste income</div>'; return; }
 let max=(caste=='SC'||caste=='ST')?250000:100000;
 if(inc>max){ r.innerHTML=`<div class=no>❌ NOT ELIGIBLE Income high</div>`; return; }
 if(aiData.f_count>0){ r.innerHTML=`<div class=no>❌ NOT ELIGIBLE F=${aiData.f_count} Backlog</div>`; return; }
 if(aiData.cgpa<5){ r.innerHTML=`<div class=no>❌ NOT ELIGIBLE CGPA <5</div>`; return; }
 r.innerHTML=`<div class=ok>✅ ELIGIBLE - REAL AI VERIFIED<br>CGPA ${aiData.cgpa} (${aiData.percentage}%)<br>P=${aiData.p_count} F=0</div>`;
}
</script></body></html>
